name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main     # Change this to master if your primary branch is called master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static files
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload compiled asset bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Instructs action to only publish the built dist folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
